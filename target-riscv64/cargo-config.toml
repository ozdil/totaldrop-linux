#
# Cargo configuration for the RISC-V 64-bit Linux target unit
# (riscv64gc-unknown-linux-gnu), targeting RV64GC workstations and SBCs
# (Milk-V Pioneer, SiFive HiFive Premier P550, StarFive VisionFive 2,
# Banana Pi BPI-F3).

[build]
target = "riscv64gc-unknown-linux-gnu"

[target.riscv64gc-unknown-linux-gnu]
linker = "riscv64-linux-gnu-gcc"
rustflags = [
    "-C", "target-feature=+m,+a,+f,+d,+c",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
]

[env]
CC_riscv64gc_unknown_linux_gnu = "riscv64-linux-gnu-gcc"
CXX_riscv64gc_unknown_linux_gnu = "riscv64-linux-gnu-g++"
AR_riscv64gc_unknown_linux_gnu = "riscv64-linux-gnu-ar"
